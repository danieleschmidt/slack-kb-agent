[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "slack-kb-agent"
version = "1.0.0"
description = "Slack bot that answers team questions using TF-IDF search over your docs"
requires-python = ">=3.9"
dependencies = ["slack-bolt>=1.18"]

[project.scripts]
slack-kb-agent = "slack_kb_agent.bot:main"

[tool.setuptools.packages.find]
include = ["slack_kb_agent*"]
